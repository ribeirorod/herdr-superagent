[package]
name = "herdr-superagent"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "A herdr plugin: one superagent session that routes your requests into tickets, runs workers in herdr panes and lets you review."
repository = "https://github.com/ribeirorod/herdr-superagent"

[[bin]]
name = "herdr-superagent"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
